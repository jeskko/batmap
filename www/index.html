<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BatMUD World Map</title>
<meta name="description" content="Interactive map of the BatMUD world">
<link rel="icon" href="img/batmud_logo2.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.Default.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <button id="sidebar-toggle" class="icon-button" type="button" aria-label="Toggle location list" aria-expanded="false" aria-controls="sidebar">
    <span></span><span></span><span></span>
  </button>
  <a class="logo" href="https://www.bat.org/" target="_blank" rel="noopener">
    <img src="img/batmud_logo2.png" alt="BatMUD" width="150" height="84">
  </a>
  <div class="titles">
    <h1>World Map</h1>
    <p class="subtitle">An interactive map of the world of BatMUD</p>
  </div>
  <button id="make-link" class="button" type="button">Copy link to this view</button>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-scroll">
      <input id="location-search" class="search-input" type="search" placeholder="Search locations…" autocomplete="off">

      <div id="type-filters"></div>
      <div id="continent-filters"></div>

      <div class="filter-group" data-section-id="filter:layers">
        <button type="button" class="section-header">
          <span class="chevron" aria-hidden="true"></span>
          <h3>Layers</h3>
        </button>
        <div class="section-body">
          <label class="toggle-row">
            <input id="route-lines-toggle" type="checkbox" checked>
            Trade lane routes
          </label>
          <label class="toggle-row">
            <input id="label-toggle" type="checkbox">
            Marker labels <span class="toggle-hint">(closest 3 zoom levels)</span>
          </label>
          <label class="toggle-row">
            <input id="ascii-toggle" type="checkbox">
            Text map <span class="toggle-hint">(closest 2 zoom levels)</span>
          </label>
        </div>
      </div>

      <div class="filter-group location-list-group" data-section-id="locations">
        <button type="button" class="section-header">
          <span class="chevron" aria-hidden="true"></span>
          <h3>Locations</h3>
        </button>
        <div class="section-body">
          <div id="location-list" class="location-list"></div>
        </div>
      </div>
    </div>
  </aside>

  <main id="map" aria-label="World map"></main>
</div>

<footer class="site-footer">
  <span id="cursor-readout" class="cursor-readout"></span>
  <span class="copyrights">
    Map data by BAT ry, Ggr, Slobber &amp; Jeskko · rendered with
    <a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>
    · <a href="privacy.html">Privacy Policy</a>
  </span>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/markercluster/leaflet.markercluster.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
